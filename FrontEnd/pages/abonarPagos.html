<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar Pago</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div class="contenedorPago">

        <div class="cardPago">

            <!-- ENCABEZADO -->

            <div class="encabezadoPago">

                <span class="tituloSeccion">
                    Registro de pago
                </span>

                <h1>
                    Registrar pago
                </h1>

                <p>
                    Ingresa la información del pago de la venta.
                </p>

            </div>


            <!-- CLIENTE -->

            <div class="clientePago">

                <h2>Cliente</h2>

                <div class="datoPago">

                    <span>
                        Nombre
                    </span>

                    <strong id="cliente"></strong>

                </div>

                <div class="datoPago">

                    <span>
                        Teléfono
                    </span>

                    <strong id="telefono"></strong>

                </div>

            </div>


            <!-- FORMULARIO -->

            <form id="formPago">


                <!-- MONTO -->

                <div class="campoPago">

                    <label for="monto">
                        Monto del pago
                    </label>

                    <div class="inputMonto">

                        <span>$</span>

                        <input
                            type="number"
                            id="monto"
                            name="monto"
                            min="0.01"
                            step="0.01"
                            placeholder="0.00"
                            required
                        >

                    </div>

                </div>


                <!-- TIPO DE PAGO -->

                <div class="campoPago">

                    <label for="tipoPago">
                        Tipo de pago
                    </label>

                    <select
                        id="tipoPago"
                        name="tipoPago"
                        required
                    >

                        <option value="">
                            Selecciona un método
                        </option>

                        <option value="EFECTIVO">
                            Efectivo
                        </option>

                        <option value="TARJETA">
                            Tarjeta
                        </option>

                    </select>

                </div>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    id="registrarPago"
                    class="btnPago"
                >
                    Registrar pago
                </button>


            </form>

        </div>

    </div>


    <script
        type="module"
        src="../js/pages/generarPago.js">
    </script>

</body>

</html>
