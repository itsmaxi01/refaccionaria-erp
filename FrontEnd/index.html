</head>

    <!-- PANEL IZQUIERDO -->

        <h1>Dashboard Vendedor</h1>

        <div class="buscador">

            <input
                id="buscador"
                type="text"
                placeholder="Buscar producto">

            <button id="btnBuscar">

            </button>

        </div>


        <div id="productos">
            <!-- JS pinta aquí los productos -->
        </div>

        <h2>Carrito</h2>

        <div id="carrito">

            <p>Vacío</p>

        </div>


        <div class="resumen">

          
            <h3 id="subtotal"></h3>

            <a href="pages/confirmacion.html">
                Ir al carrito
            </a>
            <br>

            <a href="pages/pagos.html">
